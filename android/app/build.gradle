apply plugin: 'com.android.application'

// Release signing is configured from `android/keystore.properties` (git-ignored,
// alongside the keystore it points at). Keeping the secret out of this tracked
// file means the repo builds — and `check:parity` stays green — without any
// signing material; a release build simply stays unsigned until the properties
// are supplied. See NATIVE_APPS.md -> "Release signing".
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = keystoreProps['storeFile'] != null

android {
    namespace "uk.co.stakeyscycles.staff"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "uk.co.stakeyscycles.staff"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2026101901
        versionName "1.0.20261019"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One native project ships two apps: the staff terminal and the customer
    // app. Both are built from the same codebase; the web surface bundled into
    // each is chosen at build time (see scripts/build-apps.sh). A flavor only
    // changes the installable identity (application id, app name, icon tint),
    // never the code.
    flavorDimensions "app"
    productFlavors {
        staff {
            dimension "app"
            applicationId "uk.co.stakeyscycles.staff"
        }
        customer {
            dimension "app"
            applicationId "uk.co.stakeyscycles.customer"
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign the release build when credentials are present; otherwise it
            // is left unsigned and the APK name keeps the `-unsigned` suffix.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.onesignal:OneSignal:[5.6.1, 5.99.99]'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Keep the Google Services plugin active for every build. Its flavor task must
// fail when a Firebase client registration is missing; a compile-only APK is
// not a valid native-push artifact.
apply plugin: 'com.google.gms.google-services'
