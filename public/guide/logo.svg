<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <clipPath id="shieldClip">
      <path d="M 60 70 C 180 20 320 20 440 70 C 440 260 380 400 250 480 C 120 400 60 260 60 70 Z" />
    </clipPath>
  </defs>

  <!-- Outer Green Shield Border -->
  <path
    d="M 60 70 C 180 20 320 20 440 70 C 440 260 380 400 250 480 C 120 400 60 260 60 70 Z"
    stroke="#05C147"
    stroke-width="14"
    fill="#000000"
  />

  <!-- Inside Clipped Content -->
  <g clip-path="url(#shieldClip)">
    <!-- Top Green Field -->
    <rect x="0" y="0" width="500" height="210" fill="#05C147" />

    <!-- Bottom Black Field -->
    <rect x="0" y="210" width="500" height="300" fill="#050505" />

    <!-- Horizontal Divider Line -->
    <line x1="40" y1="210" x2="460" y2="210" stroke="#05C147" stroke-width="3" />

    <!-- Top Text: STAKEYS -->
    <text
      x="250"
      y="140"
      text-anchor="middle"
      font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif"
      font-size="64"
      font-weight="700"
      letter-spacing="4"
      fill="#000000"
    >
      STAKEYS
    </text>

    <!-- Subtitle Text: cycles & scooter -->
    <text
      x="250"
      y="180"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
      font-size="28"
      font-weight="600"
      letter-spacing="2"
      fill="#000000"
    >
      cycles &amp; scooter
    </text>

    <!-- Scooter Graphic in Bottom Field -->
    <g transform="translate(160, 235)" stroke="#05C147" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Front wheel -->
      <circle cx="35" cy="115" r="18" stroke-width="7" />
      <circle cx="35" cy="115" r="8" stroke-width="4" />
      <circle cx="35" cy="115" r="3" fill="#05C147" />

      <!-- Rear wheel -->
      <circle cx="150" cy="115" r="18" stroke-width="7" />
      <circle cx="150" cy="115" r="8" stroke-width="4" />
      <circle cx="150" cy="115" r="3" fill="#05C147" />

      <!-- Rear fender -->
      <path d="M 130 108 C 135 95 160 95 166 108" stroke-width="7" />

      <!-- Deck & Frame -->
      <path d="M 38 110 L 48 95 L 45 40" stroke-width="7" />
      <path d="M 45 116 L 85 125 L 140 125 L 148 115" stroke-width="9" />

      <!-- Steering Column Stem -->
      <line x1="44" y1="40" x2="41" y2="-5" stroke-width="6" />

      <!-- Handlebars & Grips -->
      <circle cx="41" cy="-7" r="4.5" fill="#05C147" />
      <line x1="33" y1="-7" x2="49" y2="-7" stroke-width="6" />
    </g>
  </g>
</svg>
