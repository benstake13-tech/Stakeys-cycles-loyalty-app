<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="stakeyAvatarTitle stakeyAvatarDesc">
  <title id="stakeyAvatarTitle">Stakey</title>
  <desc id="stakeyAvatarDesc">Stakey, the friendly bike workshop helper character.</desc>

  <defs>
    <linearGradient id="stakeyCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ad156" />
      <stop offset="1" stop-color="#05a13a" />
    </linearGradient>
    <linearGradient id="stakeyOverall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0bbf4b" />
      <stop offset="1" stop-color="#058a33" />
    </linearGradient>
    <linearGradient id="stakeyTee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dfe6ea" />
    </linearGradient>
    <linearGradient id="stakeySkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c19a" />
      <stop offset="1" stop-color="#e0a97c" />
    </linearGradient>
    <radialGradient id="stakeyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#05C147" stop-opacity="0.30" />
      <stop offset="1" stop-color="#05C147" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="stakeyShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b0f14" stop-opacity="0.30" />
      <stop offset="1" stop-color="#0b0f14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Centre and scale the figure to fit the square frame -->
  <g transform="translate(200 200) scale(0.9) translate(-200 -211)">
    <!-- Ground shadow + brand glow -->
    <ellipse cx="200" cy="414" rx="132" ry="26" fill="url(#stakeyGlow)" />
    <ellipse cx="200" cy="412" rx="96" ry="16" fill="url(#stakeyShadow)" />

  <!-- Legs + boots -->
  <rect x="150" y="330" width="34" height="72" rx="16" fill="#048a33" />
  <rect x="216" y="330" width="34" height="72" rx="16" fill="#048a33" />
  <path d="M144 398 h46 a10 10 0 0 1 10 10 v8 h-56 z" fill="#2b3138" />
  <path d="M210 398 h46 v18 h-56 v-8 a10 10 0 0 1 10 -10 z" fill="#2b3138" />

  <!-- Torso: tee -->
  <path d="M138 208 q62 -26 124 0 l10 108 q-72 26 -144 0 z" fill="url(#stakeyTee)" />

  <!-- Overalls -->
  <path d="M150 250 h100 l6 84 q-56 20 -112 0 z" fill="url(#stakeyOverall)" />
  <path d="M158 226 l14 30 h-22 z" fill="#058a33" />
  <path d="M242 226 l-14 30 h22 z" fill="#058a33" />
  <path d="M172 244 h56 l3 14 h-62 z" fill="#046b28" />
  <!-- Pocket + buttons -->
  <rect x="180" y="276" width="40" height="34" rx="6" fill="#046b28" />
  <path d="M186 276 v34" stroke="#0bbf4b" stroke-width="2" />
  <circle cx="168" cy="256" r="5" fill="#f4d03f" />
  <circle cx="232" cy="256" r="5" fill="#f4d03f" />

  <!-- Chest badge (brand tick) -->
  <circle cx="200" cy="318" r="20" fill="#ffffff" />
  <circle cx="200" cy="318" r="20" fill="none" stroke="#05C147" stroke-width="3" />
  <path d="M190 318 l7 8 l14 -17" fill="none" stroke="#05C147" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Arms -->
  <path d="M138 212 q-26 8 -30 54 q-3 30 12 44" fill="none" stroke="url(#stakeyTee)" stroke-width="30" stroke-linecap="round" />
  <path d="M262 212 q26 8 30 54 q3 30 -12 44" fill="none" stroke="url(#stakeyTee)" stroke-width="30" stroke-linecap="round" />
  <circle cx="120" cy="314" r="17" fill="url(#stakeySkin)" />
  <circle cx="280" cy="314" r="17" fill="url(#stakeySkin)" />

  <!-- Neck -->
  <rect x="184" y="176" width="32" height="34" rx="14" fill="#d89a6e" />

  <!-- Head -->
  <ellipse cx="200" cy="128" rx="66" ry="70" fill="url(#stakeySkin)" />
  <!-- Ears -->
  <circle cx="134" cy="130" r="12" fill="#e0a97c" />
  <circle cx="266" cy="130" r="12" fill="#e0a97c" />

  <!-- Hair -->
  <path d="M136 112 q6 -52 64 -52 q58 0 64 52 q-18 -22 -64 -22 q-46 0 -64 22 z" fill="#6b4423" />

  <!-- Cap -->
  <path d="M134 112 q0 -60 66 -60 q66 0 66 60 z" fill="url(#stakeyCap)" />
  <path d="M134 112 q-30 4 -40 16 q22 8 44 4 z" fill="#048a33" />
  <rect x="134" y="104" width="132" height="12" rx="6" fill="#048a33" />
  <circle cx="200" cy="62" r="7" fill="#046b28" />

  <!-- Brows -->
  <path d="M162 108 q16 -12 34 -4" fill="none" stroke="#4a2f18" stroke-width="7" stroke-linecap="round" />
  <path d="M238 108 q-16 -12 -34 -4" fill="none" stroke="#4a2f18" stroke-width="7" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="174" cy="136" rx="14" ry="16" fill="#ffffff" />
  <ellipse cx="226" cy="136" rx="14" ry="16" fill="#ffffff" />
  <circle cx="176" cy="138" r="8" fill="#1c1f24" />
  <circle cx="224" cy="138" r="8" fill="#1c1f24" />
  <circle cx="179" cy="134" r="3" fill="#ffffff" />
  <circle cx="227" cy="134" r="3" fill="#ffffff" />

  <!-- Cheeks -->
  <circle cx="156" cy="158" r="10" fill="#e2554b" opacity="0.22" />
  <circle cx="244" cy="158" r="10" fill="#e2554b" opacity="0.22" />

  <!-- Smile -->
  <path d="M176 166 q24 24 48 0" fill="none" stroke="#7a2a2a" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
