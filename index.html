<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Digital loyalty stamp card, weekly prize wheel roulette, automated SMS &amp; email workshop service bookings, and staff management terminal for Stakey's Cycles &amp; Scooter." />
    <meta property="og:title" content="Stakey's Cycles &amp; Scooter | Loyalty, Prize Wheel &amp; Service Booking" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- OneSignal Web Push. Initialised here (before React) so the SDK is ready
         as early as possible; src/utils/pushNotifications.ts waits for this init
         through window.OneSignalDeferred instead of initialising a second time.
         The service worker it registers is public/OneSignalSDKWorker.js. -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.__oneSignalHeadInit = true;
      // A staff-set App ID override (Feature Test Bench > Repair Push) takes
      // priority over the default so a wrong/rotated App ID can be corrected
      // from the UI without a code change.
      (function () {
        var appId = '7f67ab94-3c85-4702-9cd8-d158cf294593';
        try {
          var override = window.localStorage.getItem('stakeys.onesignal.appId');
          if (override && override.trim()) appId = override.trim();
        } catch (e) {}
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.init({
            appId: appId,
            allowLocalhostAsSecureOrigin: true,
            serviceWorkerPath: '/OneSignalSDKWorker.js',
            serviceWorkerParam: { scope: '/' },
          });
        });
      })();
    </script>
  </head>
  <body class="bg-[#090b0e] text-neutral-100 antialiased selection:bg-[#05C147] selection:text-neutral-950 font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
