    <!-- OneSignal Web Push (v16). The snippet loads the SDK and queues init;
         src/utils/pushNotifications.ts waits on window.OneSignalDeferred instead
         of initialising a second time. The worker at /OneSignalSDKWorker.js is
         the official root-scope shim. -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        try {
          await OneSignal.init({
            appId: '7f67ab94-3c85-4702-9cd8-d158cf294593',
            serviceWorkerPath: '/OneSignalSDKWorker.js',
            serviceWorkerParam: { scope: '/' },
            // Never prompt automatically. Permission is only ever requested from
            // an explicit staff button (Staff → Enable Push / Push Setup → Fix),
            // so no visitor — signed in or not — gets an unprompted allow box.
            promptOptions: {
              slidedown: {
                prompts: [
                  { type: 'push', autoPrompt: false },
                  { type: 'category', autoPrompt: false },
                ],
              },
            },
          });
        } catch (err) {
          // init() rejects when the app's configured origin does not match the
          // page (e.g. OneSignal set to the apex but the app served from www).
          // Store it so the UI can explain why push is unavailable.
          window.__onesignalInitError = (err && (err.message || String(err))) || 'init failed';
          console.error('[OneSignal] init failed:', err);
        }
      });
    </script>
  </head>
  <body class="bg-[#090b0e] text-neutral-100 antialiased selection:bg-[#05C147] selection:text-neutral-950 font-['Plus_Jakarta_Sans',sans-serif]">

    <script type="module" src="/src/main.tsx"></script>
  </body>
