name: Customer Android APK
on:
  push:
    branches: [staff-terminal, customer-app]
    paths:
      - '.github/workflows/android-customer.yml'
      - 'src/**'
      - 'supabase/**'
      - 'package*.json'
      - 'android/**'
      - 'scripts/build-apps.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Hosted Ubuntu runners already include the Android SDK; avoid the setup action
      # which attempts to install the removed legacy 'tools' SDK package.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Build Customer APK
        run: |
          export JAVA_HOME="$JAVA_HOME"
          export ANDROID_HOME="$ANDROID_HOME"
          npm run apps:build:customer
      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Stakeys-Cycles-Customer-Glass-APK
          path: preview/apps/*.apk
          if-no-files-found: error
