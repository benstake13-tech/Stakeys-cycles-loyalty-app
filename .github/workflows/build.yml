name: Customer app build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production app
        run: bun run build

      - name: Check server-side Gemini endpoint builds
        run: |
          bun build src/server/geminiVision.ts api/gemini/scan-bike.ts --target=bun --outdir=/tmp/stakeys-ai-check
          if grep -R "VITE_GEMINI_API_KEY" src/; then
            echo "Never expose the Gemini API key to the client bundle."
            exit 1
          fi

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: stakeys-cycles-loyalty-app-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
