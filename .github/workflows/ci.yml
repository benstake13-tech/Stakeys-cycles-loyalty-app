name: CI

# Runs on every push and every PR into the three deployment branches. There is no
# other automated gate — without this, a broken push (bad typecheck/test, parity
# drift between surface branches, or exceeding Vercel's Hobby 12-function cap)
# silently fails the Vercel deployment and the live domain keeps serving the last
# good build ("worked before, broken now").
on:
  push:
    branches: [main, staff-terminal, customer-app, main-website]
  pull_request:
    branches: [main, staff-terminal, customer-app, main-website]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the linear-history / parity checks aren't fooled by a
          # shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vercel function budget (Hobby cap = 12)
        run: bash scripts/check-vercel-budget.sh

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
