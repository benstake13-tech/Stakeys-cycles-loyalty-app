name: Build real Staff Terminal and Customer Android apps

on:
  push:
    branches: [main]
  schedule:
    # Branch builds also refresh even when only staff-terminal/customer-app changes.
    # Native Atelier visual overhaul: rebuild both feature-complete editions.
    # Scooter-only BLE diagnostics: rebuild with latest staff source.
    # Compatible rebadged Xiaomi/Ninebot and MiniRobot BLE discovery.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stakeys-feature-complete-apks
  cancel-in-progress: true

jobs:
  android:
    name: ${{ matrix.edition }} full-feature APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: staff
            source_branch: staff-terminal
            flavor: Staff
            package_id: uk.co.stakeyscycles.staff
          - edition: customer
            source_branch: customer-app
            flavor: Customer
            package_id: uk.co.stakeyscycles.customer
    env:
      CI: 'true'
      BUILD_EDITION: ${{ matrix.edition }}
      VITE_SURFACE: ${{ matrix.edition }}
      VITE_ONESIGNAL_ANDROID_APP_ID: ${{ matrix.edition == 'staff' && vars.ONESIGNAL_STAFF_ANDROID_APP_ID || vars.ONESIGNAL_CUSTOMER_ANDROID_APP_ID }}
      # All remote /api routes must go to the real HTTPS backend, never the WebView.
      VITE_API_BASE_URL: ${{ vars.APP_API_ORIGIN || 'https://www.stakeys-cycles.co.uk' }}
    steps:
      - name: Check out the REAL ${{ matrix.edition }} website branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_branch }}
          fetch-depth: 1

      - name: Set source provenance
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "VITE_SOURCE_SHA=${SHA:0:12}" >> "$GITHUB_ENV"
          echo "APP_SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "APP_SOURCE_BRANCH=${{ matrix.source_branch }}" >> "$GITHUB_ENV"
          echo "Building source branch ${{ matrix.source_branch }} @ $SHA"

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK requirements
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install source branch's locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Assert feature-complete source is present
        run: |
          test -f src/config/surface.ts
          test -f src/utils/apiBase.ts
          test -f src/lib/supabase.ts
          test -f src/api/assistantService.ts
          test -f src/api/geminiModel.ts
          test -f src/components/StaffRepairGuideTab.tsx
          test -f src/components/StaffTradeInsTab.tsx
          test -f src/components/CareGuides.tsx
          test -f src/utils/pushNotifications.ts
          test -f src/utils/metaPublishing.ts
          test -f api/meta/'[action].js'
          test -f api/onesignal/'[action].js'
          test -f api/google-business.js
          test -f public/guide/index.html
          test -f public/guide/hangers.json
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'StaffRepairGuideTab' src/components/StaffPortal.tsx
          grep -q 'apiUrl' src/utils/apiBase.ts
          grep -q 'VITE_API_BASE_URL' src/utils/apiBase.ts
          grep -q 'productFlavors' android/app/build.gradle
          test -n "$VITE_API_BASE_URL"
          case "$VITE_API_BASE_URL" in https://*) ;; *) echo "Native API base must be HTTPS" >&2; exit 1;; esac

      - name: Typecheck source branch
        run: npm run lint

      - name: Test source branch with normal website-relative API URLs
        run: env VITE_API_BASE_URL= npm test

      - name: Build correct website surface for ${{ matrix.edition }}
        run: npm run build

      - name: Check API and training-guide artifacts
        run: |
          test -s dist/index.html
          test -s dist/guide/index.html
          test -s dist/guide/hangers.json
          grep -R -l -F "$VITE_API_BASE_URL" dist/assets/*.js >/dev/null
          # The original source names VITE_GEMINI_API_KEY in its configuration
          # helper; that string is not itself a secret. Never supply a real
          # Gemini key to the APK build. A server proxy is still required.
          if [ -n "${VITE_GEMINI_API_KEY:-}" ]; then
            echo "Do not bundle a Gemini credential into Android" >&2
            exit 1
          fi

      - name: Synchronize the source branch's EXISTING native Android project
        run: npx cap sync android

      - name: Verify website files copied byte-identically into Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          web = Path('dist')
          native = Path('android/app/src/main/assets/public')
          assert native.is_dir(), 'Capacitor failed to create native assets'
          files = sorted(path for path in web.rglob('*') if path.is_file())
          assert len(files) > 5, 'Website assets missing'
          fingerprint = hashlib.sha256()
          for path in files:
              relative = path.relative_to(web)
              copied = native / relative
              assert copied.is_file(), f'Android missing {relative}'
              assert copied.read_bytes() == path.read_bytes(), f'Android differs at {relative}'
              fingerprint.update(relative.as_posix().encode() + b'\x00')
              fingerprint.update(hashlib.sha256(path.read_bytes()).digest())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'WEB_ASSET_FINGERPRINT={fingerprint.hexdigest()}\n')
          print(f'Exact native copy verified: {len(files)} assets, SHA256={fingerprint.hexdigest()}')
          PY

      - name: Stamp native version for installable upgrades
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path=Path('android/app/build.gradle')
          source=path.read_text()
          version=int(os.environ['GITHUB_RUN_NUMBER'])
          source,n1=re.subn(r'\bversionCode\s+\d+',f'versionCode {version}',source,count=1)
          source,n2=re.subn(r'\bversionName\s+"[^"]+"',f'versionName "1.0.{version}"',source,count=1)
          assert n1 == 1 and n2 == 1, 'Android version identifiers missing'
          path.write_text(source)
          PY

      - name: Compile REAL ${{ matrix.edition }} APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assemble${{ matrix.flavor }}Debug

      - name: Verify package identity and stage download
        run: |
          mkdir -p android-output
          APK="android/app/build/outputs/apk/${BUILD_EDITION}/debug/app-${BUILD_EDITION}-debug.apk"
          test -s "$APK"
          OUTPUT="android-output/Stakeys-Cycles-${BUILD_EDITION}.apk"
          cp "$APK" "$OUTPUT"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$OUTPUT" | head -n 1 | tee /tmp/android-package
          grep -F "name='${{ matrix.package_id }}'" /tmp/android-package
          cat > android-output/BUILD_INFO.txt <<EOF
          edition=${BUILD_EDITION}
          source_branch=${APP_SOURCE_BRANCH}
          source_commit=${APP_SOURCE_SHA}
          source_short=${VITE_SOURCE_SHA}
          api_origin=${VITE_API_BASE_URL}
          website_asset_fingerprint=${WEB_ASSET_FINGERPRINT}
          github_run=${GITHUB_RUN_ID}
          EOF
          (cd android-output && sha256sum *.apk > SHA256SUMS.txt)
          cat android-output/BUILD_INFO.txt
          cat android-output/SHA256SUMS.txt

      - name: Upload full ${{ matrix.edition }} APK
        uses: actions/upload-artifact@v4
        with:
          name: Stakeys-Cycles-${{ matrix.edition }}-APK
          path: android-output/
          retention-days: 30
          if-no-files-found: error

      - name: Upload corresponding ${{ matrix.edition }} website
        uses: actions/upload-artifact@v4
        with:
          name: Stakeys-Cycles-${{ matrix.edition }}-website
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish staff and customer APK release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Fetch both verified edition artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Stakeys-Cycles-*-APK
          path: apks

      - name: Validate source branches and both packages
        run: |
          test -s apks/Stakeys-Cycles-staff-APK/Stakeys-Cycles-staff.apk
          test -s apks/Stakeys-Cycles-customer-APK/Stakeys-Cycles-customer.apk
          grep -Fx 'source_branch=staff-terminal' apks/Stakeys-Cycles-staff-APK/BUILD_INFO.txt
          grep -Fx 'source_branch=customer-app' apks/Stakeys-Cycles-customer-APK/BUILD_INFO.txt
          (cd apks/Stakeys-Cycles-staff-APK && sha256sum -c SHA256SUMS.txt)
          (cd apks/Stakeys-Cycles-customer-APK && sha256sum -c SHA256SUMS.txt)

      - name: Publish native feature-complete APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-full-features-${{ github.run_number }}"
          STAFF_SHA="$(sed -n 's/^source_commit=//p' apks/Stakeys-Cycles-staff-APK/BUILD_INFO.txt)"
          CUSTOMER_SHA="$(sed -n 's/^source_commit=//p' apks/Stakeys-Cycles-customer-APK/BUILD_INFO.txt)"
          gh release create "$TAG" \
            apks/Stakeys-Cycles-staff-APK/Stakeys-Cycles-staff.apk \
            apks/Stakeys-Cycles-customer-APK/Stakeys-Cycles-customer.apk \
            --repo "${{ github.repository }}" \
            --title "Stakey's complete Staff and Customer Android apps — build ${{ github.run_number }}" \
            --notes "Staff source: staff-terminal @ $STAFF_SHA. Customer source: customer-app @ $CUSTOMER_SHA. Includes source-defined AI tools, Meta and OneSignal API clients, Supabase integration, and staff/customer training guides. APK asset parity and source-branch tests passed. API requests need a live HTTPS backend, valid server-side secrets, and permitted CORS origins. Android WebView OneSignal web push is not native push delivery; native push configuration is separate. These are debug-signed installers, not Play Store release builds." \
            --prerelease

# Rebuild native OneSignal Android push bridge for both applications.

