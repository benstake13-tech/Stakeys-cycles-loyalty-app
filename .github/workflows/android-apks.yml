name: Build Android customer and staff APKs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'api/**'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/android-apks.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer source commit must never be overtaken by an older APK release.
concurrency:
  group: stakeys-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: ${{ matrix.edition }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [customer, staff]
    env:
      CI: 'true'
      BUILD_EDITION: ${{ matrix.edition }}
      VITE_APP_EDITION: ${{ matrix.edition }}
      # Set repository variable APP_API_ORIGIN to your HTTPS backend URL
      # to enable Gemini and other hosted /api endpoints in packaged APKs.
      VITE_APP_API_ORIGIN: ${{ vars.APP_API_ORIGIN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install Capacitor Android build toolchain
        run: npm install --no-save --no-package-lock --legacy-peer-deps @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 react-is@19

      - name: Stamp APK with its exact source commit
        run: echo "VITE_SOURCE_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.edition }} web assets
        run: bun run build

      - name: Verify complete staff and customer feature bundles
        run: node scripts/verify-mobile-feature-parity.mjs

      - name: Generate standalone Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Enable camera scanner and stamp Android version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          if 'android.permission.CAMERA' not in content:
              assert '<application' in content, 'Android manifest missing application'
              content = content.replace('<application',
                  '<uses-permission android:name="android.permission.CAMERA" />\\n'
                  '    <uses-feature android:name="android.hardware.camera" android:required="false" />\\n'
                  '    <application', 1)
              manifest.write_text(content)

          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          version = int(os.environ['GITHUB_RUN_NUMBER'])
          content, code_count = re.subn(r'\bversionCode\s*(?:=\s*)?\d+', 'versionCode ' + str(version), content, count=1)
          content, name_count = re.subn(r'\bversionName\s*(?:=\s*)?"[^"]+"', 'versionName "1.0.' + str(version) + '"', content, count=1)
          if code_count and name_count:
              gradle.write_text(content)
              print(f'Android versionCode={version}, versionName=1.0.{version}')
          else:
              print('The generated Gradle project uses version declarations we did not alter. The APK and BUILD_INFO still contain the exact source commit.')

          PY

      - name: Compile installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage, identify and checksum APK
        run: |
          mkdir -p android-output
          APK="android-output/Stakeys-Cycles-${BUILD_EDITION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          EXPECTED_PACKAGE="uk.co.stakeyscycles.${BUILD_EDITION}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1 | tee /tmp/stakeys-badging
          grep -F "name='${EXPECTED_PACKAGE}'" /tmp/stakeys-badging
          {
            echo "edition=${BUILD_EDITION}"
            echo "package_id=${EXPECTED_PACKAGE}"
            echo "source_commit=${GITHUB_SHA}"
            echo "source_short=${VITE_SOURCE_SHA}"
            echo "android_build=${GITHUB_RUN_NUMBER}"
            echo "build_run=${GITHUB_RUN_ID}"
            if [ -n "${VITE_APP_API_ORIGIN}" ]; then
              echo "gemini_backend_configured=yes"
            else
              echo "gemini_backend_configured=no"
            fi
          } > android-output/BUILD_INFO.txt
          cd android-output
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh *.apk
          cat BUILD_INFO.txt
          cat SHA256SUMS.txt

      - name: Upload ${{ matrix.edition }} APK
        uses: actions/upload-artifact@v4
        with:
          name: Stakeys-Cycles-${{ matrix.edition }}-APK
          path: android-output/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish both APKs
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download both build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Stakeys-Cycles-*-APK
          path: apks
          merge-multiple: false

      - name: Verify both APKs exist
        run: |
          test -s apks/Stakeys-Cycles-customer-APK/Stakeys-Cycles-customer.apk
          test -s apks/Stakeys-Cycles-staff-APK/Stakeys-Cycles-staff.apk

      - name: Publish fresh Android test installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-debug-${{ github.run_number }}"
          gh release create "$TAG" \
            apks/Stakeys-Cycles-customer-APK/Stakeys-Cycles-customer.apk \
            apks/Stakeys-Cycles-staff-APK/Stakeys-Cycles-staff.apk \
            --repo "${{ github.repository }}" \
            --title "Stakey's Cycles Android APKs — build ${{ github.run_number }}" \
            --notes "Two independently installable Android test builds from commit ${{ github.sha }}. Customer and staff editions have distinct package IDs. Feature-parity checks verified all staff and customer routes, including barcode scanner, OEM bike specs, hanger identifier and configuration. Each APK contains its own source commit label. Debug-signed sideload builds; Gemini requires APP_API_ORIGIN plus a deployed server-side GEMINI_API_KEY." \
            --prerelease
