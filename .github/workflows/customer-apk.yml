name: Customer Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/customer-apk.yml'
jobs:
  build-customer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Build customer web bundle
        env:
          VITE_APP_EDITION: customer
        run: npm run build
      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Generate Android project
        env:
          BUILD_EDITION: customer
        run: |
          npx cap add android
          npx cap sync android
      - name: Compile debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload installable customer APK
        uses: actions/upload-artifact@v4
        with:
          name: stakeys-customer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
