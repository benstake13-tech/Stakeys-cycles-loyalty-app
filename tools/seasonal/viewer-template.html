<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stakeys Cycles — Seasonal Worlds</title><style>
*{box-sizing:border-box}body{margin:0;background:#09191f;color:#edf5ef;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:pan-y}header{position:fixed;top:0;left:0;right:0;padding:24px 28px;background:linear-gradient(#071516e8,transparent);pointer-events:none}small{font-size:10px;letter-spacing:.25em;color:#9cd4bc}h1{font:34px Georgia;margin:9px 0}header p{font-size:12px;color:#b7c4c2}footer{position:fixed;left:20px;right:20px;bottom:18px;display:flex;gap:10px;align-items:end;justify-content:space-between}.controls{display:flex;gap:8px;flex-wrap:wrap;max-width:740px}button,select{background:#102a28e8;border:1px solid #96bdb15a;border-radius:24px;color:#e5f6ec;padding:12px 16px;font:inherit;min-height:44px;cursor:pointer;backdrop-filter:blur(16px)}button:hover{background:#245145}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #9ef2bc;outline-offset:3px}button:disabled{opacity:.45;cursor:default}#status{position:fixed;top:46%;left:0;right:0;text-align:center}footer a{display:block;color:#bde9d1;font-size:11px;min-height:44px;padding:14px 0}dialog{max-width:640px;max-height:80dvh;background:#0b2422;color:#edf6ef;border:1px solid #508a70;border-radius:20px;padding:24px}dialog::backdrop{background:#02120fe8}pre{white-space:pre-wrap;font:12px/1.6 system-ui}@media(max-width:600px){header{padding:20px}h1{font-size:26px}footer{display:block;left:16px;right:16px}.controls{gap:6px}button,select{font-size:12px;padding:10px 12px}footer a{padding:12px 0 0}}
</style><canvas id="world" aria-label="Animated seasonal woodland around the Stakeys workshop"></canvas><header><small>STAKEYS CYCLES · SEASONAL WORLDS</small><h1>The woodland after dark.</h1><p>3D characters, light and atmosphere.</p></header><div id="status" role="status">Preparing the woodland…</div><footer><div class="controls"><select id="theme" aria-label="Season"><option value="halloween">Halloween</option><option value="christmas">Christmas</option><option value="stpatricks">St Patrick’s Day</option><option value="easter">Easter</option><option value="autumn">Autumn</option><option value="winter">Winter</option><option value="valentines">Valentine’s garden</option><option value="remembranceday">Remembrance</option></select><button id="poke">Play reaction</button><select id="motion" aria-label="Motion"><option value="still">Still image</option><option value="gentle" selected>Gentle motion</option><option value="full">Full motion</option></select><button id="close" aria-pressed="false">Closer view</button></div><a href="#credits" id="showCredits">Scene credits &amp; licences</a></footer><dialog id="credits"><button id="hideCredits">Close credits</button><pre>__NOTICES__</pre></dialog><script>__ENGINE__</script><script>
const files=__ASSETS__;
let renderer,canvas=document.querySelector('#world'),clock=1.2,last=0,paint=0,active=false,loading=false,pointer=[0,0,0],down=null,theme='halloween',motion='gentle';
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),status=document.querySelector('#status'),poke=document.querySelector('#poke');
function controls(){poke.disabled=motion==='still'||theme==='remembranceday'||loading;document.querySelector('#motion').value=motion;}
function resize(){if(!renderer)return;renderer.resize(innerWidth,innerHeight,Math.min(devicePixelRatio,1.25));if(!document.hidden)renderer.draw(clock,pointer)}
async function load(){if(loading)return;loading=true;active=false;controls();status.textContent='Preparing the woodland…';if(renderer){renderer.dispose();const next=canvas.cloneNode();canvas.replaceWith(next);canvas=next;}try{
 renderer=await PremiumWorld.createPremiumRenderer(canvas,n=>files[n],{theme,motion,width:innerWidth});window.worldRenderer=renderer;clock=1.2;last=paint=0;resize();active=true;status.textContent='';window.worldReady=true;bind();
 document.querySelector('h1').textContent=theme==='halloween'?'The woodland after dark.':theme==='remembranceday'?'A moment to remember.':'A season at the workshop.';
}catch(e){status.textContent='The 3D scene could not be opened.';console.error(e);}finally{loading=false;controls();}}
function bind(){canvas.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY,t:performance.now()},{passive:true});canvas.addEventListener('pointercancel',()=>down=null);canvas.addEventListener('pointerup',e=>{const d=down;down=null;if(!d||!active||motion==='still'||theme==='remembranceday'||Math.hypot(e.clientX-d.x,e.clientY-d.y)>12||performance.now()-d.t>600)return;const index=renderer.pick(e.clientX,e.clientY);if(index>=0)renderer.poke(index)},{passive:true});}
function frame(now){if(active&&!document.hidden&&motion!=='still'&&theme!=='remembranceday'&&now-paint>1000/(motion==='full'?30:20)){clock+=Math.min(last?now-last:0,80)/1000;last=now;paint=now;renderer.draw(clock,pointer)}requestAnimationFrame(frame)}
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>last=0);document.querySelector('#theme').onchange=e=>{if(loading)return;theme=e.target.value;void load()};document.querySelector('#motion').onchange=e=>{motion=reduced.matches?'still':e.target.value;void load()};poke.onclick=()=>{if(active&&motion!=='still')renderer.poke(0)};document.querySelector('#close').onclick=e=>{pointer[2]=pointer[2]?0:.18;e.target.setAttribute('aria-pressed',String(Boolean(pointer[2])));resize()};document.querySelector('#showCredits').onclick=e=>{e.preventDefault();document.querySelector('#credits').showModal()};document.querySelector('#hideCredits').onclick=()=>document.querySelector('#credits').close();reduced.addEventListener('change',()=>{if(reduced.matches){motion='still';controls()}});
window.freezeWorld=(t=1.2)=>{motion='still';clock=t;renderer.draw(clock,pointer);controls();return renderer.stats()};window.addEventListener('pagehide',()=>renderer?.dispose(),{once:true});
if(reduced.matches)motion='still';void load();requestAnimationFrame(frame);
</script></html>
