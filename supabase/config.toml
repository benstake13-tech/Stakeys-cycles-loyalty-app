[functions.send-email]
# The browser client calls this with the anon key; Supabase's default JWT
# verification is fine (the anon key is a valid JWT). Set to false only if you
# want to allow completely unauthenticated calls.
verify_jwt = true

[functions.gemini-gateway]
verify_jwt = true

[functions.growth-advisor]
verify_jwt = true

[functions.onesignal-gateway]
verify_jwt = true

[functions.marketplace-auctions]
verify_jwt = true

[functions.staff-event-push]
# Private scheduled worker: its database-generated dispatch token is checked
# by a service-role-only RPC before claiming any events.
verify_jwt = false
